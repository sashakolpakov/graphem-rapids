[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphem-rapids"
version = "0.3.0.dev0"
description = "The canonical CUDA/RAPIDS implementation of GraphEm"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Alexander Kolpakov", email = "akolpakov@uaustin.org"},
    {name = "Igor Rivin", email = "rivin@temple.edu"}
]
maintainers = [
    {name = "Alexander Kolpakov", email = "akolpakov@uaustin.org"}
]
keywords = [
    "graph embedding",
    "node influence",
    "centrality measures",
    "network analysis",
    "force layout",
    "CUDA",
    "RAPIDS"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.11"
dependencies = [
    "cuvs-cu12>=26.6,<26.7",
    "cupy-cuda12x>=13.6.0,!=14.0.0,!=14.1.0,<15",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "networkx>=2.6.0",
    "pandas>=1.3.0",
    "plotly>=5.5.0",
    "scipy>=1.7.0",
    "torch>=2.11,<2.12",
    "loguru>=0.6.0",
    "requests>=2.25.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
rapids-full = [
    "cudf-cu12",
    "cugraph-cu12",
    "cuml-cu12",
    "cuvs-cu12>=26.6,<26.7",
    "cupy-cuda12x>=13.6.0,!=14.0.0,!=14.1.0,<15",
]
influence = [
    "ndlib>=5.1.0",
]
profiling = [
    "line_profiler>=4.0.0",
    "snakeviz>=2.2.0",
    "tensorboard>=2.10.0",
    "pyinstrument>=5.0.0",
    "tabulate>=0.9.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx_rtd_theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.12.0",
    "myst-parser>=0.17.0"
]
test = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "pytest-xdist>=2.3.0"
]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "pytest-xdist>=2.3.0",
    "sphinx>=4.0.0",
    "sphinx_rtd_theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.12.0",
    "myst-parser>=0.17.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950"
]
all = [
    "cudf-cu12",
    "cugraph-cu12",
    "cuml-cu12",
    "cuvs-cu12>=26.6,<26.7",
    "cupy-cuda12x>=13.6.0,!=14.0.0,!=14.1.0,<15",
    "ndlib>=5.1.0",
    "sphinx>=4.0.0",
    "sphinx_rtd_theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.12.0",
    "myst-parser>=0.17.0",
    "line_profiler>=4.0.0",
    "snakeviz>=2.2.0",
    "tensorboard>=2.10.0",
    "pyinstrument>=5.0.0",
    "tabulate>=0.9.0",
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "pytest-xdist>=2.3.0"
]

[project.urls]
Homepage = "https://github.com/sashakolpakov/graphem-rapids"
Documentation = "https://sashakolpakov.github.io/graphem-rapids/"
Repository = "https://github.com/sashakolpakov/graphem-rapids"
"Bug Reports" = "https://github.com/sashakolpakov/graphem-rapids/issues"
Paper = "https://arxiv.org/abs/2506.07435"
"Original GraphEm" = "https://github.com/sashakolpakov/graphem"

[tool.setuptools]
packages = {find = {include = ["graphem_rapids*"]}}
include-package-data = true
zip-safe = false
