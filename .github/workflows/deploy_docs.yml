name: Deploy Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node for Markdown checks
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Lint Markdown
      run: npx --yes markdownlint-cli2@0.23.2 "*.md"

    - name: Check documentation links
      uses: lycheeverse/lychee-action@v2
      with:
        fail: true
        token: ${{ secrets.GITHUB_TOKEN }}
        args: >-
          --no-progress
          --max-retries 3
          --accept 200,204,206,429
          README.md CONTRIBUTING.md CHANGELOG.md docs/*.rst

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints myst-parser
        pip install numpy scipy matplotlib networkx pandas plotly loguru requests tqdm
        pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -e . --no-deps

    - name: Build documentation
      run: |
        cd docs
        sphinx-build -W --keep-going -n -b html . _build/html

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        force_orphan: true
